# 2026 RoboWorld Quadruped Competition Track Waypoints & Mission Timings
# Arena size: 6.000m (Width, X) x 8.000m (Height, Y)
# Origin (0.0, 0.0) is at bottom-left corner of the arena.

mission_timings:
  stop_line_hold_sec: 2.0        # Rulebook 5.2: Minimum 2.0s full stop at stop line (+0.3s safety margin = 2.3s)
  traffic_timeout_sec: 15.0      # Max wait time for GREEN signal before fallback proceed
  parking_sit_hold_sec: 5.0      # Rulebook 5.2: Minimum 5.0s full sit in parking bay (+0.5s safety margin = 5.5s)
  safety_margin_sec: 0.3

# Competition 7-Stage Waypoint Sequence (Upright Orientation: IN at bottom-right, OUT at bottom-left)
waypoints:
  start_in:
    description: "IN Entrance Start Line (bottom-right corridor)"
    x: 5.00
    y: 0.80
    yaw_deg: 90.0

  ramp_ascend:
    description: "Turn diagonally up-left onto the Ramp toward central diamond"
    x: 4.40
    y: 2.50
    yaw_deg: 135.0

  stop_line_1:
    description: "Stop Line 1 & Traffic Light 1 (center diamond plateau)"
    x: 3.00
    y: 4.00
    yaw_deg: 135.0
    mission_action: "TRAFFIC_WAIT"

  slalom_entry:
    description: "Exit ramp at top-left into horizontal Slalom corridor"
    x: 1.20
    y: 6.80
    yaw_deg: 90.0

  slalom_mid:
    description: "Top horizontal Slalom corridor (Rubber Cones 23cm avoidance)"
    x: 3.00
    y: 7.20
    yaw_deg: 0.0
    mission_action: "SLALOM_AVOID"

  slalom_exit:
    description: "Top-right corner turning diagonally down-left onto Stairs"
    x: 4.80
    y: 6.80
    yaw_deg: -135.0

  stop_line_2:
    description: "Stop Line 2 & Traffic Light 2 (center diamond plateau on stairs)"
    x: 3.00
    y: 4.00
    yaw_deg: -135.0
    mission_action: "TRAFFIC_WAIT"

  stair_exit:
    description: "Bottom-left exit from stairs approaching lower corridor"
    x: 1.20
    y: 1.80
    yaw_deg: -90.0

  bottom_turn:
    description: "Turn into lower horizontal corridor connecting to Parking Bay 'P'"
    x: 1.80
    y: 1.50
    yaw_deg: 0.0

  parking_slot:
    description: "Designated Parking Bay 'P' center - Sit for >= 5.0s"
    x: 3.00
    y: 0.70
    yaw_deg: -90.0
    mission_action: "PARKING_SIT"

  out_align:
    description: "Exit Parking Bay and align with OUT exit lane"
    x: 1.20
    y: 1.20
    yaw_deg: -90.0

  out_finish:
    description: "Cross OUT Finish Line completely (+200 pts completion bonus)"
    x: 1.00
    y: 0.40
    yaw_deg: -90.0
    mission_action: "FINISH"
