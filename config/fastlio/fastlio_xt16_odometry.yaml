# FORK of ~/ws/lab/go2_ws/config/odometry.yaml (원본 수정 금지, 09-09 판)
# 바꾼 것은 "FORK:" 표시 3곳뿐 — 값은 팀이 검증한 ~/ws/gosu_slam/config/go2_slam_odometry.yaml 과 같다.
# 실행 파일은 원본 그대로: ~/ws/lab/install 의 fast_lio (fastlio_mapping) 를 underlay 로 참조한다.
# ==============================================================================
# Go2 FAST-LIO 실시간 오도메트리(Odometry) 설정 (빌드 불필요 - 즉시 반영)
# 위치: ~/go2_ws/config/odometry.yaml
# ==============================================================================
/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 2          # 20Hz 스캔: 32000 점 -> 1/2 다운샘플링으로 밀도 유지
        max_iteration: 4

        # [밀도 및 해상도 설정] mapping.yaml과 완벽 일치 (10cm 복셀)
        filter_size_surf: 0.10
        filter_size_map: 0.10
        cube_side_length: 1000.0     # 맵 삭제 오작동 방지 (cube_side_length > 3*det_range 필수)
        runtime_pos_log_enable: false
        map_file_path: ""

        common:
            lid_topic:  "/velodyne_points"   # go2_bridge cloud_bridge 출력
            imu_topic:  "/imu/body"          # go2_bridge imu_bridge 출력 (/lowstate 500Hz)
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 2                # 2 = Velodyne 형식 (x,y,z,intensity,ring,time)
            scan_line: 16                # Hesai XT16 = 16채널
            timestamp_unit: 0            # time 필드 단위: 초(seconds)
            blind: 0.5                   # 로봇 몸통 반경 블라인드(m)
            scan_rate: 20

        mapping:
            acc_cov: 0.5                 # 4족 보행 발걸음 충격 허용치
            gyr_cov: 0.3                 # 보행 시 몸통 흔들림 허용치 (mapping.yaml과 일치)
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree: 360.0
            det_range: 15.0              # FORK: 60 -> 15. 60 은 지도가 안 잘려 미끄러짐 (gosu_slam 검증)

            # [외부 파라미터(Extrinsic)] mapping.yaml과 100% 일치
            extrinsic_est_en: false      # 고정 파라미터 (온라인 추정 시 보행 충격 드리프트 방지)
            extrinsic_T: [ 0.25, 0.0, 0.1588 ]   # FORK: 라이다 높이 15.88cm 반영 (gosu_slam 과 동일)
            extrinsic_R: [ -0.0001707, -0.9999240,  0.0123287,   # FORK: 실측 기울기 반영 (gosu_slam 과 동일)
                            0.9999844, -0.0001019,  0.0055807,
                           -0.0055790,  0.0123295,  0.9999084 ]

        publish:
            path_en: true                # RViz 궤적 시각화를 위해 활성화 (/path)
            effect_map_en: false
            map_en: false                # 주행 중 실시간 메모리 보존을 위해 글로벌 맵 누적 비활성화
            scan_publish_en: true        # EGO-Planner 장애물 회피용 점군 (/cloud_registered)
            dense_publish_en: true       # 장애물 감지를 위해 전밀도 점군(32000점) 발행
            scan_bodyframe_pub_en: true  # 로봇 바디 프레임 점군 (/cloud_registered_body)

        pcd_save:
            pcd_save_en: false           # 주행 중 불필요한 파일 I/O 차단
            interval: -1

        # [모션 게이팅] 실시간 오도메트리는 로컬 맵의 연속적인 누적이 필수이므로 false 유지
        motion_gating:
            enable: false
            max_angular_rate: 45.0       # deg/s: 3차원 보행 흔들림 각속도 제한
            max_yaw_rate: 28.0           # deg/s: 급회전 시 로컬 맵 누적 일시정지 (드리프트 원천 차단)
            max_linear_vel: 1.2          # m/s: 정상 보행 속도 허용
            max_residual: 0.06           # m: 정합 오차 6cm 초과 시 즉시 차단
            cooldown_time: 0.2           # 초: 회전 종료 후 안정화 대기
