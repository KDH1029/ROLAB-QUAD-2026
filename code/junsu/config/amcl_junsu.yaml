# junsu 11-05: merge review go2_localization/config/amcl_params.yaml 그대로 + 프레임만 바꿈(감시 전용).
#   lio_odom = FAST-LIO(camera_init) 를 /tf_junsu 에 다시 낸 것. tf_broadcast false — 주행 좌표는 안 건드림.
#   네임스페이스 /junsu (map·amcl_pose·initialpose·request_nomotion_update 모두 /junsu/...)
/junsu/amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.15
    alpha2: 0.15
    alpha3: 0.15
    alpha4: 0.15
    alpha5: 0.1
    base_frame_id: base_link
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 15.0
    laser_min_range: 0.4
    laser_model_type: likelihood_field
    max_beams: 120
    max_particles: 3000
    min_particles: 500
    odom_frame_id: lio_odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    resample_interval: 1
    robot_model_type: nav2_amcl::OmniMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: false
    transform_tolerance: 0.5
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.8
    z_max: 0.05
    z_rand: 0.1
    z_short: 0.05
    scan_topic: /scan
    map_topic: map
    set_initial_pose: false
