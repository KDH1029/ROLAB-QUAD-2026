# ★ 2026-08-25 주행용 변경 — FAST-LIO 가 OOM 으로 죽는 문제(exit code -9)
#   pcd_save_en:true 는 종료할 때까지 등록된 스캔 전부를 RAM(pcl_wait_save)에 쌓는다.
#   주행에는 지도 저장이 필요 없다. 비교 실험에서 이걸 끄자 2.8GB -> 148MB 였다.
#   cube_side_length 1000 은 방(5.7m)에 비해 과해서 ikd-tree 가 아무것도 안 버린다.
#   매핑을 FAST-LIO 로 할 때는 pcd_save_en 을 다시 true 로. 백업: xt16.yaml.bak_pcdsave
/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 2          # 2026-08-25 20Hz 전환: 프레임당 32,000점(10Hz의 절반)이라 1/2 샘플링으로 낮춰 점 밀도 유지
        max_iteration: 3
        filter_size_surf: 0.5
        filter_size_map: 0.5
        cube_side_length: 100.0
        runtime_pos_log_enable: false
        map_file_path: "./xt16_map.pcd"

        common:
            lid_topic:  "/velodyne_points"   # xt16_fastlio_bridge.py 출력
            imu_topic:  "/imu/body"          # 브리지가 /lowstate(500Hz)에서 변환
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0    # 브리지에서 둘 다 PC시계로 재스탬핑하므로 0

        preprocess:
            lidar_type: 2                # 2 = Velodyne 형식 (브리지가 XT16을 이 형식으로 변환)
            scan_line: 16                # XT16 = 16채널
            timestamp_unit: 0            # 브리지의 time 필드 = 초 단위
            blind: 0.5                   # 로봇 몸/머리에 맞는 점 제거 반경(m)
            scan_rate: 20

        mapping:
            acc_cov: 0.5                 # 4족 보행 발걸음 충격(가속도 스파이크) 허용 — 0.1은 핸드헬드/드론 기준
            gyr_cov: 0.3                 # 보행 시 몸통 흔들림 대응
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     120.0
            extrinsic_est_en:  false     # 2026-08-25: true -> false.
            #   외부파라미터를 온라인 추정하면 자유도가 하나 더 떠서 정지 중에도 흔들린다.
            #   실측: 정지 12초에 x σ14.8mm / y σ24.9mm / pitch 범위 3.15도.
            #   이 값은 이미 실측으로 확정됐다 - 바닥평면으로 수평 확인, 직진 실측으로 yaw +90도.
            #   추정할 이유가 없으므로 고정한다.
            # 몸통IMU(base와 축 동일) 기준 XT16 위치.
            # 회전: 바닥평면 실측(2026-07-02)으로 사실상 수평 확인(pitch -0.4°, roll +1.1°) → 단위행렬.
            #   (처음 넣었던 pitch 13°는 MID360 킷 관례를 잘못 적용한 것 — 지도 휘어짐의 원인이었음)
            # yaw +90°: 직진 걷기 실측(전방 1.2m 이동이 -82°로 기록됨)으로 확정 —
            # 라이다가 마운트에 90° 돌아 장착됨 (원형 마운트 특성)
            extrinsic_T: [ 0.25, 0.0, 0.0 ]
            extrinsic_R: [ 0., -1., 0.,
                           1.,  0., 0.,
                           0.,  0., 1.]

        publish:
            path_en: false           # 2026-08-25 정리: /path 미사용
            effect_map_en: false
            map_en: false            # 2026-08-25 정리: /Laser_map(누적 전체지도)는 주행에 불필요. 발행 비용만 든다
            scan_publish_en:  true   # ★끄지 말 것: laserMapping.cpp:1074 에서 이 플래그가
                                     #  /cloud_registered_body(우리 /scan 의 소스)까지 같이 가드한다
            dense_publish_en: false
            scan_bodyframe_pub_en: true

        pcd_save:
            pcd_save_en: false            # 실전 매핑: 종료 시 PCD 저장
            interval: -1                 # ⚠️ -1(전체 1파일)=종료시 일괄 저장. 매핑은 5분 이내로 짧게(메모리 크래시 위험, 선임자 경험)
