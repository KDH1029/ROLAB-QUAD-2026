/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 2          # 20Hz scan: 32000 pts/scan, 1/2 downsample
        max_iteration: 4             # 4 iterations for solid convergence
        filter_size_surf: 0.1        # 10cm scan surface downsample: preserves fine structural details
        filter_size_map: 0.08        # 8cm map resolution: creates dense, sharp point cloud (~160k+ points)
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "/home/ilovehan9283/go2_ws/maps/go2_prior_map.pcd"

        common:
            lid_topic:  "/velodyne_points"   # Output from go2_bridge cloud_bridge
            imu_topic:  "/imu/body"          # Output from go2_bridge imu_bridge (/lowstate 500Hz)
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 2                # 2 = Velodyne format (x,y,z,intensity,time,ring)
            scan_line: 16                # Hesai XT16 = 16 channels
            timestamp_unit: 0            # time field is in seconds
            blind: 0.5                   # robot body blind radius (meters)
            scan_rate: 20

        mapping:
            acc_cov: 0.5                 # Quadruped footstep impact allowance
            gyr_cov: 0.3                 # Quadruped body sway allowance
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     60.0          # Max range 60m (eliminates far indoor glass/reflection artifacts)
            extrinsic_est_en:  true      # Online extrinsic estimation enabled to eliminate lever-arm and pitch ghosting
            extrinsic_T: [ 0.25, 0.0, 0.1588 ] # Accurate lever arm: LiDAR is 15.88cm above body IMU
            extrinsic_R: [ -0.0001707, -0.9999240,  0.0123287,
                            0.9999844, -0.0001019,  0.0055807,
                           -0.0055790,  0.0123295,  0.9999084 ]

        publish:
            path_en: true
            effect_map_en: false
            map_en: true                 # Global laser map accumulation enabled for mapping
            scan_publish_en: true        # Required for registered body cloud
            dense_publish_en: false
            scan_bodyframe_pub_en: true

        pcd_save:
            pcd_save_en: true            # Save PCD map on exit
            interval: -1                 # -1: save single full map at shutdown or trigger

        motion_gating:
            enable: true                 # Automatically pause map updates during intentional turns or severe drift
            max_angular_rate: 80.0       # deg/s: allow normal walking body pitch/roll without false pauses
            max_yaw_rate: 60.0           # deg/s: only pause during fast spin turns
            max_linear_vel: 1.5          # m/s: allow walking normally while mapping
            max_residual: 0.12           # meters: pauses map updates only on true divergence/slip
            cooldown_time: 0.1           # seconds: fast resume (0.1s) after turning completes

