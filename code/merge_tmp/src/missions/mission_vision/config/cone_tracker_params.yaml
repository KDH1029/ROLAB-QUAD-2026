# cone_tracker_node: cones from the LiDAR alone -> world-frame (AMCL map) cone positions (cone_lidar.hpp).
# Camera / YOLO fusion was removed on 11-05 (vision is the teammate's).
#   145915 replay (cones known from the map): 10/10 within 4-14 cm, 0 fakes (2-3 duplicates 21-28 cm from
#   cones 1/2); arena4 (17:56, cones moved since): 10 = the 10 placed.
# Confirmed cones stay for the whole run, also when the robot is too close to see them (under the lowest ring
# within ~0.8 m): ego_planner plans around every cone on /mission/cones within its cones.max_range.
cone_tracker_node:
  ros__parameters:
    cloud_topic: "/velodyne_points"                   # XT16 via cloud_bridge (hesai_lidar frame)
    base_frame: "base_link"
    world_frame: "map"                                # AMCL map
    base_to_lidar:                                    # = bridge_params / URDF
      xyz: [0.25, 0.0, 0.1588]
      q_xyzw: [0.0024, 0.0063, 0.7071, 0.7070]
    sync:
      buffer_s: 1.0            # s of LiDAR cone candidates kept until their TF has arrived

    lidar_cone:                # what counts as a cone cluster in one scan (cone_lidar.hpp)
      z_min: -0.306            # m in base_link: 3 cm above the floor ...
      z_max: -0.086            # ... to the cone top (23 cm) plus margin
      min_points: 3
      surface_to_center: 0.05  # m, the LiDAR sees the near face; shift to the cone axis
      cluster_tol: 0.10        # m, points closer than this join one cluster
      max_width: 0.30          # m, wider = wall / furniture
      clear_gap: 0.08          # m above z_max where "something above" starts ...
      clear_height: 0.60       # ... up to this: anything there = leg / person / box, not a cone
      floor_gap: 0.03          # m, cluster must stand this far above the lowest point around it
      floor_radius: 0.40       # m, "around"
      max_range: 6.0           # m
      tall_cell: 0.04          # m, columns with points both in the cone band and above the cone top (walls,
                               #    legs, boxes) are dropped before clustering, so a cone against a wall stands
                               #    alone instead of joining the wall. Scan only, no map. 0 = off
      tall_dilate: 1           # cells around a point searched for the other half (a wall's foot and top often
                               #    fall in neighbouring 4 cm columns)
      fine_cover: false        # "something above" only right over the cluster points; 145915: no gain, one
                               #    corner fake - left off

    lidar_only:                # confirmation: the same map spot in >= min_ratio of >= min_scans scans
      # [x0, y0, x1, y1, ...] world-frame rectangles; left out = everywhere (stair / ramp edges and low narrow
      #   objects become cones - 10-30 building bag: 41). Never write an empty list here - ROS cannot type an
      #   empty array and the node aborts at start.
      #   maps/arena1459_nocone: right slalom corridor + the left E pocket where cones stood on 11-04.
      #   (roboworld_2026 drawing: [0.5, 5.45, 5.45, 6.35, 0.5, 0.15, 5.45, 1.05])
      regions: [5.95, -0.35, 7.15, 4.9, 0.55, 2.75, 1.5, 3.85]
      wall_clearance: 0.0      # m, cones closer to a map wall are ignored. 0: only a cone centre ON a wall cell
                               #   is dropped (wall-foot bits go in the tall-column step). 145915: 0.15 -> 6/10,
                               #   0.05 -> 9/10 (cone 10 is 8.5 cm from the map wall, AMCL ~10 cm off), 0.0 -> 10/10
      min_ratio: 0.7           # seen in >= 70 % of the scans since first seen ...
      min_scans: 20            # ... judged over >= 20 scans (1 s at 20 Hz)
      confirm_hits: 5
      max_spread: 0.08         # m, sightings within this of the centre count
      assoc: 0.15              # m
      map_topic: "/map"
    tracking:
      alpha_lidar_only: 0.2    # confirmed cones: update weight of a new sighting

    output:
      obstacle_radius: 0.08    # m, ring of points per cone on /mission/cone_obstacles (14 cm base);
                               # ego_planner uses /mission/cones (centres) with its own cones.* clearance
      save_path: "~/go2_cones.yaml"  # confirmed cones written on every confirmation and on deactivate
      load_saved: false        # true: start with the saved cones (same layout again; off when it changes)
