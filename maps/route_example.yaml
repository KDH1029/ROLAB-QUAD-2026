# Route for route_runner_node (go2_run.sh --route <this file>).
# points: [x, y, yaw_deg] in the AMCL map frame, saved on site by scripts/go2_route.py save <name>.
# sequence: "<point> [stopline|parking|finish] [tol=m] [vmax=m/s]" in driving order; a point may
#           appear more than once (revisits reuse its coordinates). Without tol/vmax the step uses
#           default_goal_tol / default_max_vel.
# This example's points are placeholders - save the real ones at the venue (copy this file first).
route_runner_node:
  ros__parameters:
    default_goal_tol: 0.25
    default_max_vel: 0.6
    points:
      start: [0.0, 0.0, 0.0]
    sequence: [start, ramp, stop1 stopline tol=0.10 vmax=0.30, top, slalom_in, slalom_out,
      stop2 stopline tol=0.10 vmax=0.30, bottom, park parking tol=0.10 vmax=0.30, out finish]
    # optional overrides (defaults in route_logic.hpp):
    # stop_hold_s: 2.3        # stop line: still this long (rule >= 2 s)
    # traffic_timeout_s: 15.0 # no GREEN for this long after stopping -> proceed (loses 50, keeps 200)
    # sit_hold_s: 5.5         # parking: sitting (rule >= 5 s)
    # pass_radius: 0.5        # drive-through points: next goal once this close
    # lio.mode: stop          # FAST-LIO jump -> stop | log | off
    # lio.max_jump_m: 0.5     # set on the robot: stair impacts make FAST-LIO jump too
